<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Pocket Poets</title>
    <style>
      html, body, #root { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
    </style>
    <script>
      // Stand-in for Google's Playground SDK so the game runs anywhere.
      // Every platform call (leaderboards, lobbies, score reporting) is a no-op.
      window.PlaygroundSDK = class {
        init() { return Promise.resolve(); }
        createLobby() {} getLobby() {} updatePlayerPresence() {} startGame() {}
        sendGameEvent() {} scoreUpdated() {} levelComplete() {} gameOver() {}
        showLeaderboard() {} pauseStateChanged() {}
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
